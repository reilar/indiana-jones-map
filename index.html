<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no"
		/>
		<title>Indiana Jones tribute map - Mink Machine</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main class="content" aria-label="Indiana Jones map tribute">
			<img
				class="background"
				src="assets/airplane.png"
				alt=""
				aria-hidden="true"
			/>
			<div class="map" aria-hidden="true">
				<img class="map-image" src="assets/worldmap.png" alt="" />
				<svg
					width="1600"
					height="1200"
					viewBox="0 0 1000 400"
					fill="none"
					xmlns="http://www.w3.org/2000/svg"
				>
					<path
						class="svg-path"
						d="M 6 436 L 385 175 L 629 270 L 767 553"
						stroke="#d22"
						stroke-width="8"
					/>
				</svg>
				<div class="city fairfield"></div>
				<div class="city reykjavik"></div>
				<div class="city gothenburg"></div>
				<div class="city cairo"></div>
			</div>
		</main>

		<section class="description" aria-label="Map description">
			<h1>Indiana Jones tribute map</h1>
			<p>Example flight from Fairfield to Cairo.</p>
			<p>Maps &copy; Google</p>
		</section>
	</body>
</html>
